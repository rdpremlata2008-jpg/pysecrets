[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pysecrets-easter"
version = "1.0.0"
description = "Discover fun Python Easter eggs and coding surprises."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}

keywords = ["python", "easter-eggs", "fun"]

[tool.setuptools]
py-modules = ["pysecrets"]
