
name: PySecrets Manual Trigger

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install .

      - name: Test import
        run: |
          python -c "import pysecrets; print(pysecrets.__version__)"

      - name: Test Easter eggs
        run: |
          python -c "import pysecrets; pysecrets.version(); pysecrets.secret()"

