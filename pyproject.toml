
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysecrets-easter"
version = "1.0.0"
description = "A fun Python Easter egg library"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Shaswat"}
]
keywords = ["python", "easter-egg", "fun", "zen", "matrix"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers"
]

[tool.setuptools]
py-modules = ["pysecrets"]
